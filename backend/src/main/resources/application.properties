spring.application.name=QLPT

#Sử dụng config này nếu sử dụng MySQL
#spring.datasource.url=jdbc:mysql://localhost:3306/QLPT?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
#spring.datasource.username=root
#spring.datasource.password=
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Sử dụng config này nếu sử dụng MariaDB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/QLPT}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate chỉ kiểm tra schema
#Nếu sử dụng MySQL thì comment dòng này lại
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway quản lý schema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

# Không chạy schema.sql/data.sql bằng cơ chế khác
spring.sql.init.mode=never
# Browser sessions; enable secure cookies behind HTTPS in deployment.
server.servlet.session.timeout=8h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.error.include-message=never
spring.jpa.open-in-view=false
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
# Enable native forwarding only behind a trusted reverse proxy.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

# Cấu hình tải tệp hình ảnh
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads